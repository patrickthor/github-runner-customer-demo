name: Publish Lighthouse ARM Artifacts

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Validate only, or provision storage and publish artifacts"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - publish
      artifact_version:
        description: "Immutable version (blank uses the full Git commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lighthouse-arm-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Lighthouse ARM (${{ inputs.action }})
    # Runs inside the ephemeral ACI runner pool. deploy-runners.yml builds the
    # module-owned runner image with Azure CLI before this workflow can run.
    runs-on:
      - self-hosted
      - azure
      - container-instance

    defaults:
      run:
        working-directory: examples/lighthouse-arm-demo

    env:
      ARM_USE_OIDC: true
      ARM_USE_MSI: false
      ARM_CLIENT_ID: ${{ secrets.AZURE_VENDING_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.LIGHTHOUSE_ARTIFACT_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_managing_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_artifact_storage_subscription_id: ${{ vars.LIGHTHOUSE_ARTIFACT_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_artifact_storage_resource_group_name: ${{ vars.LIGHTHOUSE_ARTIFACT_RESOURCE_GROUP }}
      TF_VAR_artifact_storage_account_name: ${{ vars.LIGHTHOUSE_ARTIFACT_STORAGE_ACCOUNT }}
      TF_VAR_artifact_storage_container_name: ${{ vars.LIGHTHOUSE_ARTIFACT_CONTAINER || 'lighthouse-artifacts' }}
      TF_VAR_artifact_storage_location: ${{ vars.AZURE_LOCATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify self-hosted runner toolchain
        run: |
          if ! command -v az >/dev/null 2>&1; then
            echo "::error::Azure CLI is missing from the self-hosted runner image. Run Deploy Runners with action=apply to rebuild the module-owned runner image in ACR, then retry this workflow."
            exit 1
          fi
          az version --output json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_VENDING_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.LIGHTHOUSE_ARTIFACT_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Authenticate module downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global \
            url."https://oauth2:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Resolve immutable artifact version
        env:
          REQUESTED_VERSION: ${{ inputs.artifact_version }}
        run: |
          VERSION="${REQUESTED_VERSION:-$GITHUB_SHA}"
          if ! [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::artifact_version must start with an alphanumeric character and contain only letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          echo "TF_VAR_artifact_version=$VERSION" >> "$GITHUB_ENV"
          echo "LIGHTHOUSE_ARTIFACT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check governance and storage configuration
        env:
          STATE_RG: ${{ vars.STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
          STATE_SUBSCRIPTION_ID: ${{ vars.STATE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ ! -f terraform.tfvars ]; then
            echo "::error::terraform.tfvars is missing. It is the committed Lighthouse governance record."
            exit 1
          fi
          if [ -z "$STATE_RG" ] || [ -z "$STATE_SA" ] || [ -z "$STATE_SUBSCRIPTION_ID" ]; then
            echo "::error::STATE_RESOURCE_GROUP, STATE_STORAGE_ACCOUNT and a state subscription ID must be configured."
            exit 1
          fi
          if [ -z "$TF_VAR_artifact_storage_resource_group_name" ] || [ -z "$TF_VAR_artifact_storage_account_name" ] || [ -z "$TF_VAR_artifact_storage_location" ]; then
            echo "::error::LIGHTHOUSE_ARTIFACT_RESOURCE_GROUP, LIGHTHOUSE_ARTIFACT_STORAGE_ACCOUNT and AZURE_LOCATION must be configured."
            exit 1
          fi
          if [ "$TF_VAR_artifact_storage_account_name" = "$STATE_SA" ]; then
            echo "::error::LIGHTHOUSE_ARTIFACT_STORAGE_ACCOUNT must differ from STATE_STORAGE_ACCOUNT."
            exit 1
          fi

          cat > backend.hcl <<EOF
          resource_group_name  = "$STATE_RG"
          storage_account_name = "$STATE_SA"
          container_name       = "$STATE_CONTAINER"
          key                  = "lighthouse-artifacts.tfstate"
          subscription_id      = "$STATE_SUBSCRIPTION_ID"
          use_azuread_auth     = true
          use_oidc             = true
          EOF

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -reconfigure -input=false -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          # Generated ARM templates are customer artifacts, not useful log data.
          if ! terraform plan -input=false -out=tfplan > plan.log 2>&1; then
            cat plan.log
            exit 1
          fi
          echo "Terraform plan completed; rendered templates were not printed."

      - name: Plan summary
        run: |
          COUNT=$(terraform show -json tfplan | jq -r '.planned_values.outputs.customer_count.value // 0')
          {
            echo "### Lighthouse artifact-storage and ARM plan"
            echo ""
            echo "Customer templates: **$COUNT**"
            echo "Artifact version: \`$LIGHTHOUSE_ARTIFACT_VERSION\`"
            echo "Artifact account: \`$TF_VAR_artifact_storage_account_name\`"
            echo "Artifact container: \`$TF_VAR_artifact_storage_container_name\`"
            echo "State remains in: \`${{ vars.STATE_STORAGE_ACCOUNT }}/${{ vars.STATE_CONTAINER || 'tfstate' }}/lighthouse-artifacts.tfstate\`"
            echo ""
            echo "The Lighthouse module is fixed to ARM rendering; no customer subscription is changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Provision dedicated storage and materialize outputs
        if: inputs.action == 'publish'
        run: |
          if ! terraform apply -auto-approve -input=false tfplan > apply.log 2>&1; then
            cat apply.log
            exit 1
          fi
          echo "Dedicated artifact storage is ready; rendered templates were not printed."

      - name: Publish immutable templates
        if: inputs.action == 'publish'
        run: |
          STORAGE_ACCOUNT=$(terraform output -raw artifact_storage_account_name)
          ARTIFACT_CONTAINER=$(terraform output -raw artifact_storage_container_name)
          CONTAINER_URL=$(terraform output -raw artifact_container_url)

          READY=false
          for attempt in $(seq 1 12); do
            if az storage blob list \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$ARTIFACT_CONTAINER" \
              --auth-mode login \
              --num-results 1 \
              --output none 2>/dev/null; then
              READY=true
              break
            fi
            echo "Artifact data-plane RBAC not ready ($attempt/12); retrying in 10s..."
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "::error::The publishing identity cannot access $STORAGE_ACCOUNT/$ARTIFACT_CONTAINER after 120 seconds. Check Storage Blob Data Contributor propagation."
            exit 1
          fi

          OUTPUT_DIR="$RUNNER_TEMP/lighthouse-arm"
          mkdir -p "$OUTPUT_DIR"
          terraform output -json arm_template_json > "$OUTPUT_DIR/templates.json"
          terraform output -json arm_template_sha256 > "$OUTPUT_DIR/checksums.json"
          CUSTOMER_COUNT=$(jq 'length' "$OUTPUT_DIR/templates.json")

          if [ "$CUSTOMER_COUNT" -eq 0 ]; then
            echo "::warning::customers is empty; no Lighthouse artifacts were published."
            echo "No artifacts published because \`customers = {}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Published Lighthouse ARM artifacts"
            echo ""
            echo "Storage account: \`$STORAGE_ACCOUNT\`"
            echo "Private container: \`$ARTIFACT_CONTAINER\`"
            echo "Container URL: \`$CONTAINER_URL\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r CUSTOMER; do
            FILE="$OUTPUT_DIR/${CUSTOMER}-lighthouse.json"
            jq -jr --arg customer "$CUSTOMER" '.[$customer]' "$OUTPUT_DIR/templates.json" > "$FILE"
            EXPECTED_SHA=$(jq -r --arg customer "$CUSTOMER" '.[$customer]' "$OUTPUT_DIR/checksums.json")
            ACTUAL_SHA=$(sha256sum "$FILE" | cut -d ' ' -f 1)

            if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
              echo "::error::Checksum mismatch while materializing $CUSTOMER."
              exit 1
            fi

            BLOB_NAME="$CUSTOMER/$LIGHTHOUSE_ARTIFACT_VERSION/lighthouse.json"
            EXISTING_SHA=$(az storage blob show \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$ARTIFACT_CONTAINER" \
              --name "$BLOB_NAME" \
              --auth-mode login \
              --query 'metadata.sha256' \
              --output tsv 2>/dev/null || true)

            if [ -n "$EXISTING_SHA" ]; then
              if [ "$EXISTING_SHA" != "$EXPECTED_SHA" ]; then
                echo "::error::Immutable artifact $BLOB_NAME already exists with a different checksum. Choose a new artifact version."
                exit 1
              fi
              echo "Artifact already exists with the expected checksum: $BLOB_NAME"
            else
              az storage blob upload \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$ARTIFACT_CONTAINER" \
                --name "$BLOB_NAME" \
                --file "$FILE" \
                --content-type "application/json" \
                --metadata "sha256=$EXPECTED_SHA" "gitcommit=$GITHUB_SHA" \
                --overwrite false \
                --auth-mode login \
                --output none
              echo "Published $BLOB_NAME"
            fi

            BLOB_URL="${CONTAINER_URL}/${BLOB_NAME}"
            {
              echo "- \`$BLOB_NAME\`"
              echo "  - Private URL: \`$BLOB_URL\`"
              echo "  - SHA-256: \`$EXPECTED_SHA\`"
              echo "  - Download: \`az storage blob download --account-name $STORAGE_ACCOUNT --container-name $ARTIFACT_CONTAINER --name $BLOB_NAME --file lighthouse.json --auth-mode login\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r 'keys[]' "$OUTPUT_DIR/templates.json")

      - name: Remove git credentials
        if: always()
        run: |
          git config --global --unset-all \
            url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf || true

# ==============================================================================
# Deploy Identity Governance
#
# One configuration, one state, two modules:
#
#   access-vending    Entra groups + Azure RBAC bindings + PIM activation policies
#                     GATE 2 — who may activate what, and how.
#
#   access-packages   Catalogs + access packages + assignment policies
#                     GATE 1 — who may enter a scope at all.
#
# Runs on the self-hosted ACI runners provisioned by this repo, the same as
# demo-storage.yml. Manual dispatch only: this configuration decides who can become
# Owner on a subscription, so an accidental push to main must not change it. Pick
# the action explicitly.
#
# ------------------------------------------------------------------------------
# THE TWO COMPONENT MODES
#
#   groups-and-pim                   Module 1 only. Gate 2 exists; nothing is
#                                    requestable yet. The right first state on a new
#                                    tenant: verify group naming and test activation
#                                    with a hand-added member before any package
#                                    exists. Needs no entitlement-management
#                                    licensing and no EntitlementManagement Graph
#                                    permission.
#
#   groups-pim-and-access-packages   Both modules. Catalogs and access packages on
#                                    top of the above.
#
# The choice lives HERE and nowhere else. It sets TF_VAR_enable_access_packages, and
# a TF_VAR always beats terraform.tfvars — so keeping a copy of the switch in the
# committed tfvars would be a value that can never take effect. One source, so
# there is nothing to reconcile.
#
# Default is groups-and-pim: the smaller blast radius, and the mode you run first.
#
# SWITCHING BACK DOWN IS DESTRUCTIVE. Selecting groups-and-pim when packages already
# exist deletes the catalogs and access packages — users lose their assignments, and
# any resource role finished by hand in the portal goes with the package. The plan
# for that looks routine, so it is guarded by confirm_remove_access_packages below.
#
# Catalogs and access packages are the ONLY things the switch removes. Groups, RBAC
# bindings and PIM policies are never touched by it, and PIM onboarding is
# irreversible regardless.
#
# ------------------------------------------------------------------------------
# REQUIRED GITHUB CONFIGURATION  (Settings -> Secrets and variables -> Actions)
#
#   Secrets:
#     AZURE_CLIENT_ID          Client ID of the OIDC identity. Reused from the
#                              runner-platform deploy by default.
#     AZURE_VENDING_CLIENT_ID  Optional. Set this to run identity governance under
#                              a separate identity; it takes precedence.
#     AZURE_TENANT_ID          Entra tenant ID
#     AZURE_SUBSCRIPTION_ID    Subscription the azurerm provider authenticates to
#
#   Variables (reused from the runner platform deploy):
#     STATE_RESOURCE_GROUP     Resource group holding the state storage account
#     STATE_STORAGE_ACCOUNT    Storage account for Terraform state
#     STATE_CONTAINER          optional, default: tfstate
#     VENDING_STATE_KEY        optional, default: access-vending.tfstate
#
# ONE state key for both modules. That is the point of the design: the ordering
# between PIM policies and access packages becomes a dependency in the graph rather
# than a pipeline convention. See main.tf for why that ordering is not merely
# tidiness.
#
# The state account is NOT created here. deploy-runners.yml already creates it on
# first run; this workflow connects to it under its own state key.
#
# ------------------------------------------------------------------------------
# !! PERMISSIONS THE RUNNER IDENTITY NEEDS — READ BEFORE FIRST RUN !!
#
# This job runs on the self-hosted ACI runners, the same as demo-storage.yml, but
# authenticates differently: OIDC federation rather than the runner's managed
# identity. Where a job runs and which identity it uses are independent choices.
#
# By default it reuses AZURE_CLIENT_ID, the identity that deploys the runner
# platform. That is deliberate: it already holds User Access Administrator on the
# subscription, Storage Blob Data Contributor on the state account, and a federated
# credential with the right subject — so there is no second identity to create.
#
# Why not the runner's managed identity, given demo-storage.yml uses it: that
# identity is attached to the container and shared by every job on the pool.
# Granting it Group.ReadWrite.All would let anything running there manage any group
# in the tenant. OIDC costs nothing extra here and avoids that.
#
# ONE identity runs BOTH modules, and that is not just convenience:
# azuread_access_package_resource_catalog_association fails with
# CallerNotResourceOwner when the caller does not own the group being linked, and
# module 1's identity owns every group it creates. A separate identity for the
# packages would need group ownership or Catalog owner on top.
#
# ------------------------------------------------------------------------------
# GRAPH PERMISSIONS (application permissions, admin consent required)
#
#   Always:
#     Group.ReadWrite.All
#     User.Read.All
#     RoleManagementPolicy.ReadWrite.AzureADGroup
#     PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup
#
#   Additionally when access packages are enabled:
#     EntitlementManagement.ReadWrite.All
#
# Azure RBAC, on each vended subscription (only for azure_pim roles):
#     User Access Administrator
#     -- the tighter "Role Based Access Control Administrator" is NOT enough: it
#        covers the role bindings but not the PIM policies.
#
# Azure RBAC, on the Terraform state storage account:
#     Storage Blob Data Contributor
#     -- deploy-runners.yml grants this to AZURE_CLIENT_ID when it creates the
#        account. A separate identity needs it granted explicitly, or `init` fails
#        with 403 AuthorizationPermissionMismatch on ListBlobs.
#
# Setup commands are in examples/access-vending-demo/README.md.
#
# The entra_role mechanism needs two further Graph permissions
# (RoleManagement.ReadWrite.Directory and
# RoleEligibilitySchedule.ReadWrite.Directory). The first lets the identity assign
# directory roles anywhere in the tenant, including to itself — which is why it is
# left commented out in terraform.tfvars, and why it should stay that way while
# this shares an identity with the platform deploy.
#
# ------------------------------------------------------------------------------
# LICENSING — the access-packages half can fail at APPLY, not at plan
#
# Eligible group membership in access packages requires Entra ID Governance or
# Entra Suite. P2 alone is NOT enough. A P2-only tenant plans cleanly and then
# fails partway through the apply, so verify before enabling packages:
#
#   scripts/verify-entitlement-management.sh   (in the access-packages repo)
# ==============================================================================

name: Deploy Identity Governance

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

      components:
        description: "What to deploy"
        required: true
        default: groups-and-pim
        type: choice
        options:
          - groups-and-pim
          - groups-pim-and-access-packages

      confirm_remove_access_packages:
        description: "Required to apply a run that DELETES catalogs/access packages"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  # State is a single file. Two concurrent runs give a lock conflict at best.
  group: identity-governance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.components }})
    runs-on:
      - self-hosted
      - azure
      - container-instance

    # Kept on the self-hosted runners so the deployment still exercises the
    # platform this repo builds. OIDC works identically here and on ubuntu-latest
    # — `id-token: write` is available on both — so moving this job off the pool is
    # a one-line change to `runs-on` with no auth rework.

    defaults:
      run:
        working-directory: examples/access-vending-demo

    env:
      # Federated identity. ARM_USE_OIDC makes the azurerm and azuread providers
      # exchange the per-run GitHub token for an Azure access token, so
      # ARM_CLIENT_ID must be set explicitly here — it deliberately overrides the
      # runner managed identity's client ID that the scaler injects into the
      # container environment.
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_VENDING_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Belt and braces: the ACI runner has a managed identity attached, and
      # leaving this unset risks the provider chain falling back to IMDS and
      # authenticating as the wrong principal with a confusing 403 rather than a
      # clear failure.
      ARM_USE_MSI: false

      # Provider config comes from secrets, never from the committed tfvars.
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_provider_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # >= 1.9 is a hard requirement: both modules' validations use
          # cross-variable references, which do not exist before 1.9.
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      # Terraform fetches both modules by cloning them with git. That clone is
      # anonymous by default, and anonymous requests from the runners' shared
      # egress IP get rate-limited by GitHub. The response is an auth challenge,
      # and because there is no terminal to prompt on the clone dies with
      # "could not read Username for 'https://github.com'" — which reads like a
      # private-repo problem but is not.
      #
      # GITHUB_TOKEN can read any public repository, so authenticating costs no
      # extra secret and removes the rate limit. Applied globally because
      # go-getter clones into .terraform/modules, outside this repo, where local
      # git config does not reach.
      - name: Authenticate module downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global \
            url."https://oauth2:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "Configured authenticated git for github.com."

      # ------------------------------------------------------------------------
      # Turn the component choice into the one Terraform variable that gates
      # module "access_packages". Done before anything expensive, so an unknown
      # value fails in two seconds.
      # ------------------------------------------------------------------------
      - name: Resolve components
        id: mode
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          case "$COMPONENTS" in
            groups-and-pim)
              PACKAGES="false"
              ;;
            groups-pim-and-access-packages)
              PACKAGES="true"
              ;;
            *)
              echo "::error::Unknown components value: $COMPONENTS"
              exit 1
              ;;
          esac

          # This is the ONLY place the switch is set. terraform.tfvars deliberately
          # does not carry a copy: TF_VAR always wins, so a copy there could never
          # take effect.
          echo "TF_VAR_enable_access_packages=$PACKAGES" >> "$GITHUB_ENV"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Components: $COMPONENTS  ->  enable_access_packages = $PACKAGES"

          {
            echo "### Deploying: \`$COMPONENTS\`"
            echo ""
            if [ "$PACKAGES" = "true" ]; then
              echo "Entra groups, Azure RBAC bindings and PIM activation policies (**gate 2**),"
              echo "plus catalogs, access packages and assignment policies (**gate 1**)."
              echo ""
              echo "Needs \`EntitlementManagement.ReadWrite.All\` on the deploy identity, and"
              echo "**Entra ID Governance or Entra Suite** licensing. P2 alone is not enough and"
              echo "fails partway through the apply rather than at plan."
            else
              echo "Entra groups, Azure RBAC bindings and PIM activation policies (**gate 2**)"
              echo "only. No catalogs and no access packages, so nothing is requestable yet and"
              echo "no user can obtain access without being added to a group by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deploy identity is configured
        env:
          VENDING_CLIENT_ID: ${{ secrets.AZURE_VENDING_CLIENT_ID }}
          PLATFORM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PACKAGES_ENABLED: ${{ steps.mode.outputs.packages }}
        run: |
          if [ -n "$VENDING_CLIENT_ID" ]; then
            echo "Using the dedicated identity (AZURE_VENDING_CLIENT_ID)."
          elif [ -n "$PLATFORM_CLIENT_ID" ]; then
            echo "Using AZURE_CLIENT_ID — the runner-platform deployer — for identity governance."
            echo "::notice::Sharing the platform deploy identity with identity governance. Its blast radius extends from one subscription to tenant-wide group management. Set AZURE_VENDING_CLIENT_ID to split them."
          else
            echo "::error::Neither AZURE_VENDING_CLIENT_ID nor AZURE_CLIENT_ID is set. One of them must hold the client ID of an identity with a federated credential for this repository."
            exit 1
          fi

          if [ "$PACKAGES_ENABLED" = "true" ]; then
            echo "::notice::Access packages are enabled. The deploy identity additionally needs the Graph application permission EntitlementManagement.ReadWrite.All, with admin consent. A missing grant surfaces as 403 on the first catalog resource."
          fi

      - name: Check terraform.tfvars is present
        run: |
          if [ ! -f terraform.tfvars ]; then
            echo "::error::terraform.tfvars not found. It must be COMMITTED — the access configuration is the governance record. If a broad *.tfvars rule was added to .gitignore, restore the exception for this path."
            exit 1
          fi
          echo "Found terraform.tfvars ($(wc -l < terraform.tfvars) lines)"

      - name: Generate backend.hcl
        env:
          STATE_RG: ${{ vars.STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
          STATE_KEY: ${{ vars.VENDING_STATE_KEY || 'access-vending.tfstate' }}
        run: |
          if [ -z "$STATE_RG" ] || [ -z "$STATE_SA" ]; then
            echo "::error::STATE_RESOURCE_GROUP and STATE_STORAGE_ACCOUNT variables must be set. deploy-runners.yml creates the state account on its first run."
            exit 1
          fi

          # use_azuread_auth: data-plane access via RBAC, not account keys.
          # use_oidc: authenticate the backend with the same federated identity as
          # the providers. That principal needs Storage Blob Data Contributor on
          # this account.
          cat > backend.hcl <<EOF
          resource_group_name  = "$STATE_RG"
          storage_account_name = "$STATE_SA"
          container_name       = "$STATE_CONTAINER"
          key                  = "$STATE_KEY"
          use_azuread_auth     = true
          use_oidc             = true
          EOF

          echo "Backend: $STATE_SA/$STATE_CONTAINER/$STATE_KEY (both modules, one state)"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Both module sources must resolve at init even in groups-and-pim mode:
      # Terraform fetches every declared module regardless of `count`, and the
      # reference to module.access_vending.contract has to exist. So a failure here
      # naming a missing ref is almost always a missing TAG, not a network problem.
      - name: Terraform Init
        run: |
          for attempt in 1 2 3; do
            terraform init -input=false -backend-config=backend.hcl && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "::error::init failed after 3 attempts. If the message mentions a missing ref or \"couldn't find remote ref\", the module pins in main.tf point at something that does not exist in the module repos — check the refs rather than retrying. Both modules are pinned deliberately in lockstep because they share a versioned contract."
          exit 1

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action != 'destroy'
        run: |
          for attempt in 1 2 3; do
            terraform plan -input=false -out=tfplan && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Terraform Plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -out=tfplan

      # ------------------------------------------------------------------------
      # The demo escape hatch grants standing eligibility outside the access
      # package flow. It must never reach a real environment.
      # ------------------------------------------------------------------------
      - name: Verify no demo eligibility
        if: inputs.action != 'destroy'
        run: |
          if terraform show -json tfplan | grep -q 'demo_eligible_user_principal_names":\["'; then
            echo "::error::demo_eligible_user_principal_names is in use. That grants standing eligibility outside the access package flow and must not occur in CI."
            exit 1
          fi
          echo "OK — no demo eligibility in plan."

      # ------------------------------------------------------------------------
      # Guard the destructive direction of the component switch.
      #
      # Read from the PLAN rather than from the inputs, because the plan is the only
      # thing that knows what already exists. Selecting groups-and-pim on a tenant
      # that never had packages deletes nothing and passes silently; selecting it
      # after they were deployed deletes them and is caught here.
      #
      # Deliberately not applied to `destroy`: asking for a destroy is already an
      # explicit request to remove everything.
      # ------------------------------------------------------------------------
      - name: Guard access package deletion
        if: inputs.action == 'apply'
        env:
          CONFIRMED: ${{ inputs.confirm_remove_access_packages }}
        run: |
          terraform show -no-color tfplan > plan.txt

          DESTROY_RE='^[[:space:]]*# .*azuread_access_package.* will be destroyed'
          DELETING=$(grep -cE "$DESTROY_RE" plan.txt || true)
          echo "Access package resources marked for deletion: ${DELETING:-0}"

          if [ "${DELETING:-0}" -gt 0 ]; then
            if [ "$CONFIRMED" != "true" ]; then
              echo "::error::This apply would DELETE $DELETING catalog/access-package resource(s). Users lose their assignments and have to request access again, and any resource role finished by hand in the portal is lost with the package. Groups, RBAC bindings and PIM policies are NOT affected. Re-run with confirm_remove_access_packages = true if that is intended."
              grep -E "$DESTROY_RE" plan.txt || true
              exit 1
            fi
            echo "::warning::Deleting $DELETING access package resource(s), confirmed by input."
          else
            echo "OK — no access package deletions in plan."
          fi

      - name: Plan summary
        run: |
          {
            echo "### Terraform ${{ inputs.action }} — plan"
            echo '```'
            terraform show -no-color tfplan | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: |
          for attempt in 1 2 3; do
            terraform apply -auto-approve -input=false tfplan && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      # ------------------------------------------------------------------------
      # Gate 2 — always present
      # ------------------------------------------------------------------------
      - name: Gate 2 summary (groups, RBAC, PIM)
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Gate 2 — groups, RBAC bindings and PIM policies"
            echo ""
            echo "One line per role: group, mechanism, model, what it grants."
            echo '```'
            terraform output -json access_summary
            echo '```'
            echo "Who approves activation, per role:"
            echo '```json'
            terraform output -json approvers_by_role
            echo '```'
            echo "Catalog label per scope — one catalog per distinct label:"
            echo '```json'
            terraform output -json catalog_labels
            echo '```'
            echo "Assignment ceilings implied by the PIM policies (days). Exceeding one lets"
            echo "PIM expire the eligibility while the package still lists the user as assigned:"
            echo '```json'
            terraform output -json assignment_ceilings
            echo '```'
            echo "SCIM work list for target clouds (pim_for_groups only) — Terraform does not"
            echo "connect these groups to AWS, GCP or GitHub:"
            echo '```json'
            terraform output -json target_cloud_bindings
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------------
      # Gate 1 — only when access packages are part of the run
      # ------------------------------------------------------------------------
      - name: Gate 1 summary (catalogs, access packages)
        if: inputs.action == 'apply' && steps.mode.outputs.packages == 'true'
        run: |
          {
            echo "### Gate 1 — catalogs and access packages"
            echo ""
            echo "Catalogs (created here or adopted):"
            echo '```json'
            terraform output -json catalogs
            echo '```'
            echo "Packages per catalog. A catalog is a delegation boundary, so this listing"
            echo "is security-relevant:"
            echo '```json'
            terraform output -json packages_by_catalog
            echo '```'
            echo "What each package actually grants, after exclusions:"
            echo '```json'
            terraform output -json granted_groups_by_package
            echo '```'
            echo "Request approvers per package:"
            echo '```json'
            terraform output -json gate_1_approvers
            echo '```'
            echo "Peer approval — a lone systemeier cannot approve their own activation, and"
            echo "the PIM request timeout is a fixed 24 hours:"
            echo '```json'
            terraform output -json peer_approval_status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # This is the step that matters more than the apply succeeding. Parts of this
      # model cannot be expressed in Terraform today, and a green apply says
      # nothing about them.
      - name: Manual steps Terraform could not do
        if: inputs.action == 'apply' && steps.mode.outputs.packages == 'true'
        run: |
          {
            echo "### :warning: Finish by hand"
            echo ""
            echo "Expected to be non-empty whenever the configuration has \`pim_for_groups\`"
            echo "roles. The azuread provider validates a resource role's access type to"
            echo "\`Member\`/\`Owner\` only, so \"Eligible Member\" cannot be set from Terraform."
            echo "Those groups ARE registered as catalog resources, so each is one click in"
            echo "the portal rather than a full registration."
            echo '```json'
            terraform output -json manual_steps_required
            echo '```'
            echo '```json'
            terraform output -json excluded_resource_roles
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Next step when packages are disabled
        if: inputs.action == 'apply' && steps.mode.outputs.packages != 'true'
        run: |
          {
            echo "### Access packages are not deployed"
            echo ""
            echo "Gate 2 exists — the groups, RBAC bindings and PIM policies are in place —"
            echo "but nothing is requestable, so no user can obtain access without being"
            echo "added to a group by hand."
            echo ""
            echo "To continue:"
            echo ""
            echo "1. Verify the group names and test activation with a hand-added member."
            echo "2. Run \`scripts/verify-entitlement-management.sh\` from the access-packages"
            echo "   repo. Eligible group membership in access packages needs **Entra ID"
            echo "   Governance or Entra Suite** — P2 alone fails partway through the apply."
            echo "3. Grant \`EntitlementManagement.ReadWrite.All\` to the deploy identity,"
            echo "   with admin consent."
            echo "4. Re-run this workflow with \`components: groups-pim-and-access-packages\`."
            echo "   Nothing to commit — the choice lives on the workflow, not in tfvars."
            echo ""
            echo "\`terraform output contract\` shows exactly what the packages would be built"
            echo "from, before enabling them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-destroy notes
        if: inputs.action == 'destroy'
        run: |
          {
            echo "### Destroy complete — what Terraform did not undo"
            echo ""
            echo "**PIM onboarding is irreversible.** A group that was managed by PIM stays"
            echo "managed, and deleted groups can linger in the PIM for Groups list for up to"
            echo "24 hours. Re-applying with the same group names shortly after may hit"
            echo "friction."
            echo ""
            echo "**\`azuread_directory_role\` does nothing on destroy**, so any Entra directory"
            echo "roles activated by the \`entra_role\` mechanism remain activated in the tenant."
            echo ""
            echo "**Resource roles added by hand in the portal are gone** with their access"
            echo "package, and are not recorded anywhere in state. Re-check"
            echo "\`manual_steps_required\` after the next apply."
          } >> "$GITHUB_STEP_SUMMARY"

      # The token is short-lived and these runners are ephemeral, but leaving a
      # credential in global git config on a shared pool is not a habit worth
      # forming.
      - name: Remove git credentials
        if: always()
        run: |
          git config --global --unset-all \
            url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf || true

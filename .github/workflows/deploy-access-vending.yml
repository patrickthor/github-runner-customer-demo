# ==============================================================================
# Deploy Access Vending — Entra groups, RBAC bindings and PIM policies
#
# Runs on the self-hosted ACI runners provisioned by this repo, the same as
# demo-storage.yml. Manual dispatch only: this configuration decides who can
# become Owner on a subscription, so an accidental push to main must not change
# it. Pick the action explicitly.
#
# ------------------------------------------------------------------------------
# REQUIRED GITHUB CONFIGURATION  (Settings -> Secrets and variables -> Actions)
#
#   Secrets:
#     AZURE_CLIENT_ID          Client ID of the OIDC identity. Reused from the
#                              runner-platform deploy by default.
#     AZURE_VENDING_CLIENT_ID  Optional. Set this to run access vending under a
#                              separate identity; it takes precedence.
#     AZURE_TENANT_ID          Entra tenant ID
#     AZURE_SUBSCRIPTION_ID    Subscription the azurerm provider authenticates to
#
#   Variables (reused from the runner platform deploy):
#     STATE_RESOURCE_GROUP     Resource group holding the state storage account
#     STATE_STORAGE_ACCOUNT    Storage account for Terraform state
#     STATE_CONTAINER          optional, default: tfstate
#     VENDING_STATE_KEY        optional, default: access-vending.tfstate
#
# The state account is NOT created here. deploy-runners.yml already creates it on
# first run; this workflow connects to it under a separate state key so the two
# configurations never share a state file.
#
# ------------------------------------------------------------------------------
# !! PERMISSIONS THE RUNNER IDENTITY NEEDS — READ BEFORE FIRST RUN !!
#
# This job runs on the self-hosted ACI runners, the same as demo-storage.yml, but
# authenticates differently: OIDC federation rather than the runner's managed
# identity. Where a job runs and which identity it uses are independent choices.
#
# By default it reuses AZURE_CLIENT_ID, the identity that deploys the runner
# platform. That is deliberate: it already holds User Access Administrator on the
# subscription, Storage Blob Data Contributor on the state account, and a
# federated credential with the right subject — so there is no second identity to
# create or manage.
#
# Why not the runner's managed identity, given demo-storage.yml uses it: that
# identity is attached to the container and shared by every job on the pool.
# Granting it Group.ReadWrite.All would let anything running there manage any
# group in the tenant. It would also need Storage Blob Data Contributor added for
# the remote backend. OIDC costs nothing extra here and avoids both.
#
# To split access vending onto its own identity later, set AZURE_VENDING_CLIENT_ID
# and grant it the permissions below. The workflow prefers it automatically; no
# other change is needed.
#
# ------------------------------------------------------------------------------
# PERMISSIONS THE AUTHENTICATING IDENTITY NEEDS
#
# Azure roles are already in place if you are reusing AZURE_CLIENT_ID. The Graph
# permissions are NOT — they require a one-time admin consent, and no identity
# choice avoids that step.
#
# Microsoft Graph (application permissions, admin consent required):
#     Group.ReadWrite.All
#     User.Read.All
#     RoleManagementPolicy.ReadWrite.AzureADGroup
#     PrivilegedEligibilitySchedule.ReadWrite.AzureADGroup
#
# Azure RBAC, on each vended subscription (only for azure_pim roles):
#     User Access Administrator
#     -- the tighter "Role Based Access Control Administrator" is NOT enough:
#        it covers the role bindings but not the PIM policies.
#
# Azure RBAC, on the Terraform state storage account:
#     Storage Blob Data Contributor
#     -- deploy-runners.yml grants this to AZURE_CLIENT_ID when it creates the
#        account, so reusing that identity needs nothing here. A separate identity
#        needs it granted explicitly, or `init` fails with
#        403 AuthorizationPermissionMismatch on ListBlobs.
#
# Setup commands are in examples/access-vending-demo/README.md.
#
# The entra_role mechanism needs two further Graph permissions
# (RoleManagement.ReadWrite.Directory and
# RoleEligibilitySchedule.ReadWrite.Directory). The first lets the identity assign
# directory roles anywhere in the tenant, including to itself — which is why it is
# left commented out in terraform.tfvars, and why it should stay that way while
# this shares an identity with the platform deploy.
#
# ------------------------------------------------------------------------------
# ORDER OF OPERATIONS
#
# This must apply BEFORE any access-package repo. Not only because the groups
# must exist: for pim_for_groups the PIM policy must be written first, or the
# access package resource-role picker offers only "Member" and not "Eligible
# Member" -- giving standing membership instead of JIT, with nothing failing.
# ==============================================================================

name: Deploy Access Vending

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

concurrency:
  # State is a single file. Two concurrent runs give a lock conflict at best.
  group: access-vending-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on:
      - self-hosted
      - azure
      - container-instance

    # Kept on the self-hosted runners so the deployment still exercises the
    # platform this repo builds. OIDC works identically here and on
    # ubuntu-latest — `id-token: write` is available on both — so moving this
    # job off the pool is a one-line change to `runs-on` with no auth rework.

    defaults:
      run:
        working-directory: examples/access-vending-demo

    env:
      # Federated identity. ARM_USE_OIDC makes the azurerm and azuread providers
      # exchange the per-run GitHub token for an Azure access token, so
      # ARM_CLIENT_ID must be set explicitly here — it deliberately overrides the
      # runner managed identity's client ID that the scaler injects into the
      # container environment.
      #
      # This reuses AZURE_CLIENT_ID, the runner-platform deployer. Deliberate: it
      # already has the state-storage data role and a federated credential with
      # the right subject, so there is no second identity to manage. Set
      # AZURE_VENDING_CLIENT_ID to split them later — the workflow prefers it when
      # present and needs no other change.
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_VENDING_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Belt and braces: the ACI runner has a managed identity attached, and
      # leaving this unset risks the provider chain falling back to IMDS and
      # authenticating as the wrong principal with a confusing 403 rather than a
      # clear failure.
      ARM_USE_MSI: false

      # Provider config comes from secrets, never from the committed tfvars.
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_provider_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # >= 1.9 is a hard requirement: the module's validations use
          # cross-variable references, which do not exist before 1.9.
          terraform_version: "~> 1.9"
          terraform_wrapper: false

      # Terraform fetches the access-vending module by cloning it with git. That
      # clone is anonymous by default, and anonymous requests from the runners'
      # shared egress IP get rate-limited by GitHub. The response is an auth
      # challenge, and because there is no terminal to prompt on the clone dies
      # with "could not read Username for 'https://github.com'" — which reads like
      # a private-repo problem but is not.
      #
      # GITHUB_TOKEN can read any public repository, so authenticating costs no
      # extra secret and removes the rate limit. Applied globally because
      # go-getter clones into .terraform/modules, outside this repo, where local
      # git config does not reach.
      - name: Authenticate module downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global \
            url."https://oauth2:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          echo "Configured authenticated git for github.com."

      - name: Check the vending identity is configured
        env:
          VENDING_CLIENT_ID: ${{ secrets.AZURE_VENDING_CLIENT_ID }}
          PLATFORM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$VENDING_CLIENT_ID" ]; then
            echo "Using the dedicated vending identity (AZURE_VENDING_CLIENT_ID)."
          elif [ -n "$PLATFORM_CLIENT_ID" ]; then
            echo "Using AZURE_CLIENT_ID — the runner-platform deployer — for access vending."
            echo "It needs the four Graph application permissions in addition to its Azure roles."
            echo "::notice::Sharing the platform deploy identity with access vending. Its blast radius extends from one subscription to tenant-wide group management. Set AZURE_VENDING_CLIENT_ID to split them."
          else
            echo "::error::Neither AZURE_VENDING_CLIENT_ID nor AZURE_CLIENT_ID is set. One of them must hold the client ID of an identity with a federated credential for this repository."
            exit 1
          fi

      - name: Check terraform.tfvars is present
        run: |
          if [ ! -f terraform.tfvars ]; then
            echo "::error::terraform.tfvars not found. It must be COMMITTED — the access configuration is the governance record. If a broad *.tfvars rule was added to .gitignore, restore the exception for this path."
            exit 1
          fi
          echo "Found terraform.tfvars ($(wc -l < terraform.tfvars) lines)"

      - name: Generate backend.hcl
        env:
          STATE_RG: ${{ vars.STATE_RESOURCE_GROUP }}
          STATE_SA: ${{ vars.STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.STATE_CONTAINER || 'tfstate' }}
          STATE_KEY: ${{ vars.VENDING_STATE_KEY || 'access-vending.tfstate' }}
        run: |
          if [ -z "$STATE_RG" ] || [ -z "$STATE_SA" ]; then
            echo "::error::STATE_RESOURCE_GROUP and STATE_STORAGE_ACCOUNT variables must be set. deploy-runners.yml creates the state account on its first run."
            exit 1
          fi

          # use_azuread_auth: data-plane access via RBAC, not account keys.
          # use_oidc: authenticate the backend with the same federated identity as
          # the providers. That principal needs Storage Blob Data Contributor on
          # this account — deploy-runners.yml only grants it to AZURE_CLIENT_ID.
          cat > backend.hcl <<EOF
          resource_group_name  = "$STATE_RG"
          storage_account_name = "$STATE_SA"
          container_name       = "$STATE_CONTAINER"
          key                  = "$STATE_KEY"
          use_azuread_auth     = true
          use_oidc             = true
          EOF

          echo "Backend: $STATE_SA/$STATE_CONTAINER/$STATE_KEY"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          for attempt in 1 2 3; do
            terraform init -input=false -backend-config=backend.hcl && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action != 'destroy'
        run: |
          for attempt in 1 2 3; do
            terraform plan -input=false -out=tfplan && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Terraform Plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -input=false -out=tfplan

      # The demo escape hatch grants standing eligibility outside the access
      # package flow. It must never reach a real environment.
      - name: Verify no demo eligibility
        if: inputs.action != 'destroy'
        run: |
          if terraform show -json tfplan | grep -q 'demo_eligible_user_principal_names":\["'; then
            echo "::error::demo_eligible_user_principal_names is in use. That grants standing eligibility outside the access package flow and must not occur in CI."
            exit 1
          fi
          echo "OK — no demo eligibility in plan."

      - name: Plan summary
        run: |
          {
            echo "### Terraform ${{ inputs.action }} — plan"
            echo '```'
            terraform show -no-color tfplan | tail -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: |
          for attempt in 1 2 3; do
            terraform apply -auto-approve -input=false tfplan && exit 0
            echo "Attempt $attempt/3 failed — retrying in 30s..."
            sleep 30
          done
          echo "All attempts failed"
          exit 1

      - name: Output contract
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Contract for the access-package repo"
            echo ""
            echo "Group names, keyed \`{scope}--{role}\`:"
            echo '```json'
            terraform output -json group_names
            echo '```'
            echo "Access type per group — set this on the resource role binding:"
            echo '```json'
            terraform output -json access_package_access_type
            echo '```'
            echo "Approver groups, keyed on scope (only scopes with a \`dual\` role):"
            echo '```json'
            terraform output -json approver_group_names
            echo '```'
            echo "System owners per scope — request-gate approvers:"
            echo '```json'
            terraform output -json systemeier_by_scope
            echo '```'
            echo "SCIM work list for target clouds (pim_for_groups only):"
            echo '```json'
            terraform output -json target_cloud_bindings
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-destroy notes
        if: inputs.action == 'destroy'
        run: |
          {
            echo "### Destroy complete — two things Terraform did not undo"
            echo ""
            echo "**R4** — \`azuread_directory_role\` does nothing on destroy, so any Entra"
            echo "directory roles activated by the \`entra_role\` mechanism remain activated"
            echo "in the tenant."
            echo ""
            echo "**R1** — PIM onboarding is irreversible, and deleted groups can linger in"
            echo "the PIM for Groups list for up to 24 hours. Re-applying with the same group"
            echo "names shortly after may hit friction."
          } >> "$GITHUB_STEP_SUMMARY"

      # The token is short-lived and these runners are ephemeral, but leaving a
      # credential in global git config on a shared pool is not a habit worth
      # forming.
      - name: Remove git credentials
        if: always()
        run: |
          git config --global --unset-all \
            url."https://oauth2:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf || true
